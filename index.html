<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    
    <style>
      html,body{
      height:100%;
      }
      body {
        font-family: 'DM Sans', sans-serif;
        margin: 0 auto;
        padding:0px;
        background-color: #d3dbe7;
      }
      header{
        color:rgb(245, 244, 244);
        background-color: rgb(58, 73, 123);
        font-family:'DM Sans', sans-serif; 
        padding-left:20px;
        margin: 0px 0px;
        display: flex;
        flex-direction: column;
        width: 100%;
        box-sizing: border-box;
      }
      h2 {
        color: #333;
      }

      section {
        background: rgba(245, 245, 245, 0.774);
        padding: 15px;
        margin: 60px 60px;
        margin-bottom: 20px;
        border-radius: 11px;
      }

      input,
      select,
      button {
        padding: 8px;
        margin: 5px;
        width:200px;
        background-color:#d2d3d4cf;
        border-radius: 8px;
        border-color:#d2d3d4cf;
        font-size: 18px;
        font-family: 'DM Sans', sans-serif;
      }
      #tasksList{
        padding: 15px 15px;
        border-radius: 5px;
        background-color: #f8f6f6d8;
        border-color: #333333cf;
        font-family: 'DM Sans', sans-serif;
      }
      .tasks{
       margin-bottom: 15px;
       padding: 8px;
       font-size: 18px;
       background-color: #d7dde7cf;
       border-radius: 8px;


      }
      #reportArea {
        margin-top: 15px;
        padding: 10px;
        min-height: 100px;
        background-color: #fafafa;
        border-radius: 5px;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Task management</h1>
    </header>

    <!-- Lisätään tehtävä -->
    <section>
      <h2>Add a new task</h2>
      <input type="text" id="taskName" placeholder="Insert new task" />
      <input type="button" id="addTaskBtn" value="Add task" onclick="insertTask()" />
    </section>

    <!-- Näytetään tehtävälista -->
    <section>
      <h2>Task list</h2>
      <div id="tasksList">Tasks are...</div>
    </section>

    <!-- Päivitetään tehtävää-->
    <section>
      <h2>Update task</h2>
      <input type="text" id="updateTaskName" placeholder="Give task name" />

      <select id="newStatus">
        <option value="Not Started">Not started</option>
        <option value="In Progress">In progress</option>
        <option value="Done">Done</option>
      </select>

      <input type="button" value="Update task" onclick="updateTaskInformation()" />
    </section>
    <!-- Raportointi -->
    <section>
      <h2>Summary</h2>
      <input type="button" id="showSummaryBtn" value="Show Summary" onclick="showSummary()" />
      <div id="reportArea">Summary of tasks...</div>
    </section>

    <script>
      let tasks = [];

      function insertTask() {
        addTask();
      }

      function updateTaskInformation() {
        let taskName = document.getElementById("updateTaskName").value;
        newStatus = document.getElementById("newStatus").value;
        let found = updateTask(taskName, newStatus);
        if (found) {
          refreshList();
          document.getElementById("updateTaskName").value = "";
        } else {
          alert("Tehtävää ei löytynyt:" + taskName);
        }
      }

      function refresh() {}

      function showSummary() {

        let reportText = showReportByStatus(tasks);
         document.getElementById("reportArea").innerHTML = reportText;
       
        }
    </script>
    <!-- JavaScript-tiedostot -->
    <script src="addTask.js"></script>
    <script src="refreshTaskList.js"></script>
    <script src="updateTask.js"></script>
    <script src="reports.js"></script>
  </body>
</html>
